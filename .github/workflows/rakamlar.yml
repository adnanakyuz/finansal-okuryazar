# Her sabah 06.00 civarı (İstanbul) ücretsiz kaynaklardan kur, altın ve kripto rakamlarını çeker,
# veri/rakamlar.json dosyasına yazar. Yazı işleri 07.00'de bu dosyayı birinci kaynak olarak kullanır.
name: Rakamları çek

on:
  schedule:
    - cron: "0 3 * * *"   # 03.00 UTC = 06.00 İstanbul (GitHub bazen 10-30 dk gecikir)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/rakamlar.mjs
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/rakamlar.json
          git diff --cached --quiet && exit 0
          git commit -m "Günün rakamları $(TZ=Europe/Istanbul date +%F)"
          git push
