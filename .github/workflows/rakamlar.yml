# Her sabah 06.00 civarı (İstanbul):
#  1. Ücretsiz kaynaklardan kur, altın ve kripto rakamlarını çeker → veri/rakamlar.json
#  2. Ücretsiz haber akışlarından (RSS) son 72 saatin haberlerini çeker → veri/haberler.json
# Yazı işleri 07.00'de bu iki dosyayı kaynak olarak kullanır (bulut ortamı haber sitelerini açamasa da).
name: Rakamları ve haberleri çek

on:
  schedule:
    - cron: "0 3 * * *"   # 03.00 UTC = 06.00 İstanbul (GitHub bazen 10-30 dk gecikir)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rakamlar
        run: node scripts/rakamlar.mjs
      - name: Haberler
        run: node scripts/haberler.mjs
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veri/rakamlar.json veri/haberler.json
          git diff --cached --quiet && exit 0
          git commit -m "Günün rakamları ve haberleri $(TZ=Europe/Istanbul date +%F)"
          git pull --rebase
          git push
